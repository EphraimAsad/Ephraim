name: Ephraim CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run security:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run verify:renderer

  real-gguf-smoke:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Download public tiny test GGUF
        run: curl --fail --location --retry 3 --silent --show-error "https://huggingface.co/tensorblock/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q2_K.gguf" -o /tmp/ephraim-test.gguf
      - name: Run local inference without Ollama
        run: node scripts/gguf-smoke.mjs /tmp/ephraim-test.gguf

      - name: Verify actual Ephraim chat Model Test path
        run: npx tsx scripts/chat-test-smoke.ts /tmp/ephraim-test.gguf
      - name: Verify real conversation and evidence prompt
        run: npx tsx scripts/conversation-smoke.ts /tmp/ephraim-test.gguf

      - name: Download public tiny embedding GGUF
        run: curl --fail --location --retry 3 --silent --show-error "https://huggingface.co/CompendiumLabs/bge-small-en-v1.5-gguf/resolve/main/bge-small-en-v1.5-q4_k_m.gguf" -o /tmp/ephraim-embed-test.gguf
      - name: Verify real GGUF embeddings
        run: node scripts/embedding-smoke.mjs /tmp/ephraim-embed-test.gguf

  history-secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install open-source Gitleaks scanner
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error "https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks gitleaks
      - name: Scan full reachable history (no secret values in logs)
        shell: bash
        run: |
          set +e
          /tmp/gitleaks/gitleaks detect --source=. --redact --no-banner --log-opts="--all" --exit-code=2 > /tmp/gitleaks.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            echo "Secret scan failed or potential credentials detected. Review privately; do not publish scan output."
            exit "$result"
          fi
          grep -E "commits scanned|no leaks found" /tmp/gitleaks.log | sed -E 's/\x1B\[[0-9;]*[mK]//g' || true
