name: Windows installer verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build unpacked Windows app first
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'Electron build failed' }
          npx electron-builder --win --x64 --dir
          if ($LASTEXITCODE -ne 0) { throw 'Windows application packaging failed' }
      - name: Download public tiny GGUF for packaged inference test
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri 'https://huggingface.co/tensorblock/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q2_K.gguf' -OutFile (Join-Path $env:RUNNER_TEMP 'ephraim-test.gguf')
      - name: Run packaged Electron local GGUF inference smoke test
        shell: pwsh
        timeout-minutes: 8
        run: |
          $env:EPHRAIM_TEST_GGUF = Join-Path $env:RUNNER_TEMP 'ephraim-test.gguf'
          $env:EPHRAIM_TEST_MARKER_FILE = Join-Path $env:RUNNER_TEMP 'ephraim-selftest-pass.txt'
          $env:EPHRAIM_TEST_TRACE_FILE = Join-Path $env:RUNNER_TEMP 'ephraim-selftest-trace.txt'
          $binary = Resolve-Path '.\release\win-unpacked\Ephraim.exe'
          $stdout = Join-Path $env:RUNNER_TEMP 'ephraim-selftest-out.txt'
          $stderr = Join-Path $env:RUNNER_TEMP 'ephraim-selftest-err.txt'
          $proc = Start-Process -FilePath $binary -ArgumentList '--ephraim-self-test' -PassThru -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          if (-not $proc.WaitForExit(90000)) {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Content $env:EPHRAIM_TEST_TRACE_FILE -ErrorAction SilentlyContinue
            throw 'Packaged GGUF inference timed out after 90 seconds'
          }
          if ($proc.ExitCode -ne 0) { Get-Content $env:EPHRAIM_TEST_TRACE_FILE -ErrorAction SilentlyContinue; throw "Packaged GGUF inference failed with exit code $($proc.ExitCode)" }
          if ((-not (Test-Path $env:EPHRAIM_TEST_MARKER_FILE)) -or ((Get-Content $env:EPHRAIM_TEST_MARKER_FILE -Raw).Trim() -ne 'PASS')) { throw 'Inference success marker missing' }
          Write-Output 'Packaged native GGUF inference verified.'
      - name: Build unsigned NSIS installer after verified inference
        run: |
          npx electron-builder --win nsis --x64
          if ($LASTEXITCODE -ne 0) { throw 'Windows NSIS build failed' }
      - name: Verify installer exists
        shell: pwsh
        run: |
          $packages = Get-ChildItem release -Filter '*.exe' -Recurse
          if ($packages.Count -eq 0) { throw 'Windows installer missing' }
          $packages | ForEach-Object { Get-FileHash -Algorithm SHA256 $_.FullName | Format-List }
      - uses: actions/upload-artifact@v4
        with:
          name: ephraim-windows-unsigned-test
          path: release/*.exe
          retention-days: 1
