name: Windows installer verification
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Build unsigned installer
        run: npm run pack:win
      - name: Verify installer exists
        shell: pwsh
        run: |
          $packages = Get-ChildItem release -Filter '*.exe' -Recurse
          if ($packages.Count -eq 0) { throw 'Windows installer missing' }
          $packages | ForEach-Object { Get-FileHash -Algorithm SHA256 $_.FullName | Format-List }
      - uses: actions/upload-artifact@v4
        with:
          name: ephraim-windows-unsigned-test
          path: release/*.exe
          retention-days: 1
